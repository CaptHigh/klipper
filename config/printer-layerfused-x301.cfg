# Klipper configuration for Layerfused X301 CoreXY 3D Printer
# Control Board: BigTreeTech SKR 2
# Build Volume: 300x300x330mm
# ADXL345 accelerometer connected to Raspberry Pi

# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader" (or STM32F429 for newer boards).
# The "make flash" command does not work on the SKR 2. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR 2
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.

########################################
# MCU Configuration
########################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_CHANGEME
# Run "ls /dev/serial/by-id/*" to find your MCU serial

# Raspberry Pi as secondary MCU for ADXL345
[mcu host]
serial: /tmp/klipper_host_mcu

########################################
# Printer Configuration
########################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

########################################
# Stepper Configuration - CoreXY
########################################

# Motor A (Left rear) - Connected to X driver on SKR2
[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
# 20 tooth pulley, 2mm GT2 belt: 20*2 = 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 40
homing_retract_dist: 0

# Motor B (Right rear) - Connected to Y driver on SKR2
[stepper_y]
step_pin: PD5
dir_pin: PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 40
homing_retract_dist: 0

# Z Axis - 2mm lead screw
[stepper_z]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 2
# 2mm lead screw
endstop_pin: ^PC0
position_endstop: 0
position_min: -2
position_max: 330
homing_speed: 10

########################################
# TMC2209 Stepper Driver Configuration
########################################

[tmc2209 stepper_x]
uart_pin: PE0
run_current: 0.800
stealthchop_threshold: 999999
diag_pin: ^PC1
driver_SGTHRS: 100

[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.800
stealthchop_threshold: 999999
diag_pin: ^PC3
driver_SGTHRS: 100

[tmc2209 stepper_z]
uart_pin: PD0
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.600
stealthchop_threshold: 999999

########################################
# Extruder Configuration
########################################

[extruder]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.71
# Adjust based on your direct drive extruder gear ratio
# BMG style: 7.71, typical direct drive: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
min_temp: 0
max_temp: 300
max_extrude_only_distance: 100.0
pressure_advance: 0.05
# Tune this value for your filament
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
# Run PID_CALIBRATE HEATER=extruder TARGET=210

########################################
# Heated Bed Configuration
########################################

[heater_bed]
heater_pin: PD7
sensor_type: Generic 3950
sensor_pin: PA1
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
# Run PID_CALIBRATE HEATER=heater_bed TARGET=60

########################################
# Fan Configuration
########################################

# Part cooling fan
[fan]
pin: PB7

# Hotend cooling fan
[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0

# Electronics enclosure fan (optional)
#[controller_fan electronics_fan]
#pin: PB5
#idle_timeout: 60

########################################
# ADXL345 Accelerometer on Raspberry Pi
########################################

[adxl345]
cs_pin: host:None
spi_bus: spidev1.0
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 150, 20
# Center of bed

# Input shaper - run SHAPER_CALIBRATE to tune
[input_shaper]
shaper_freq_x: 50
shaper_freq_y: 50
shaper_type: mzv

########################################
# Bed Leveling
########################################

[bed_screws]
screw1: 30, 30
screw2: 270, 30
screw3: 270, 270
screw4: 30, 270

# Uncomment if using probe (BLTouch, inductive, etc.)
#[probe]
#pin: ^PC2
#x_offset: 0
#y_offset: 25
#z_offset: 0
#speed: 5.0
#samples: 2

#[bed_mesh]
#speed: 120
#horizontal_move_z: 5
#mesh_min: 30, 30
#mesh_max: 270, 270
#probe_count: 5, 5
#algorithm: bicubic

########################################
# Homing Override for Sensorless Homing
########################################

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    G90
    G0 Z5 F600
    {% if "x" not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if "y" not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}
    G28 Z
    G0 Z10 F600

########################################
# Motor Power Enable
########################################

# Due to BTT implementing a Marlin-specific safety feature,
# "anti-reversal stepper protection", this pin needs pulling
# high to pass power to stepper drivers and most FETs
[output_pin motor_power]
pin: PC13
value: 1

########################################
# Display Configuration
########################################

# Uncomment for 12864 LCD display
#[display]
#lcd_type: uc1701
#cs_pin: EXP1_3
#a0_pin: EXP1_4
#rst_pin: EXP1_5
#contrast: 63
#encoder_pins: ^EXP2_5, ^EXP2_3
#click_pin: ^!EXP1_2

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE10, EXP1_7=PE12, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE9, EXP1_6=PE11, EXP1_8=PE13, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

########################################
# Macros
########################################

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    # Start heating bed
    M140 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Home the printer
    G28
    # Move Z up
    G1 Z10 F3000
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    # Prime line
    G1 X5 Y5 F3000
    G1 Z0.3 F300
    G1 X100 E15 F1500
    G1 Z0.5 F300
    G92 E0

[gcode_macro END_PRINT]
gcode:
    # Turn off heaters
    M140 S0
    M104 S0
    # Retract
    G91
    G1 E-2 F2700
    G1 Z10 F3000
    # Present print
    G90
    G1 X5 Y290 F3000
    # Turn off motors
    M84
    # Turn off fan
    M106 S0

[gcode_macro CANCEL_PRINT]
gcode:
    END_PRINT

########################################
# Idle Timeout
########################################

[idle_timeout]
timeout: 1800

########################################
# Virtual SD Card
########################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

########################################
# Additional Notes
########################################

# IMPORTANT: Before first use:
# 1. Update the MCU serial path in [mcu] section
# 2. Run PID calibration for extruder and bed
# 3. Calibrate extruder rotation_distance
# 4. Run SHAPER_CALIBRATE for input shaper tuning
# 5. Verify stepper motor directions
# 6. Set proper Z endstop position
# 7. Tune sensorless homing sensitivity (driver_SGTHRS)

# For ADXL345 on Raspberry Pi:
# Ensure SPI is enabled on the Pi (raspi-config)
# Install klipper_mcu service for host MCU
# Wiring: VCC->3.3V, GND->GND, CS->GPIO8(SPI CE0),
#         SDO->GPIO9(MISO), SDA->GPIO10(MOSI), SCL->GPIO11(SCLK)
